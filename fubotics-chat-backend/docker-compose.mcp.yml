services:
  postgres:
    image: postgres:15-alpine
    container_name: fubotics-dino-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PGDATABASE:-fubotics}
      POSTGRES_USER: ${PGUSER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - fubotics_dino_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-postgres} -d ${PGDATABASE:-fubotics}"]
      interval: 5s
      timeout: 5s
      retries: 20

  dino-mcp:
    build:
      context: .
      dockerfile: mcp-server/Dockerfile
    container_name: fubotics-dino-mcp
    command: ["node", "mcp-server/http-server.js"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    environment:
      DATABASE_URL: ""
      PGHOST: ${DINO_KB_PGHOST:-postgres}
      PGPORT: ${DINO_KB_PGPORT:-5432}
      PGDATABASE: ${PGDATABASE:-fubotics}
      PGUSER: ${PGUSER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD:-postgres}
      PGSSL: "false"
      NODE_ENV: ${NODE_ENV:-development}
      JWT_SECRET: ${JWT_SECRET:-please_change_this_secret}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_BASE_URL: ${GROQ_BASE_URL:-https://api.groq.com/openai/v1}
      GROQ_CHAT_MODEL: ${GROQ_CHAT_MODEL:-llama-3.3-70b-versatile}
      HUGGINGFACE_API_KEY: ${HUGGINGFACE_API_KEY:-}
      HF_TOKEN: ${HF_TOKEN:-}
      HF_ROUTER_BASE_URL: ${HF_ROUTER_BASE_URL:-https://router.huggingface.co/v1}
      HF_CHAT_MODEL: ${HF_CHAT_MODEL:-katanemo/Arch-Router-1.5B:hf-inference}
      DINO_SELF_LEARNING: ${DINO_SELF_LEARNING:-true}
      DINO_ALWAYS_WEB: ${DINO_ALWAYS_WEB:-false}
      DINO_AGENT_MODEL: ${DINO_AGENT_MODEL:-katanemo/Arch-Router-1.5B:hf-inference}
      DINO_AGENT_MAX_ITERATIONS: ${DINO_AGENT_MAX_ITERATIONS:-3}
      AI_MAX_TOKENS: ${AI_MAX_TOKENS:-2048}
      AI_DEEP_SEARCH_MAX_TOKENS: ${AI_DEEP_SEARCH_MAX_TOKENS:-3072}
      DEEP_SEARCH_MAX_RESULTS: ${DEEP_SEARCH_MAX_RESULTS:-4}
      DEEP_SEARCH_SNIPPET_CHARS: ${DEEP_SEARCH_SNIPPET_CHARS:-700}
      DEEP_SEARCH_FETCH_PAGES: ${DEEP_SEARCH_FETCH_PAGES:-false}
      DEEP_SEARCH_SEARCH_TIMEOUT_MS: ${DEEP_SEARCH_SEARCH_TIMEOUT_MS:-9000}
      DEEP_SEARCH_PAGE_TIMEOUT_MS: ${DEEP_SEARCH_PAGE_TIMEOUT_MS:-8000}
      MCP_SEARCH_TIMEOUT_MS: ${MCP_SEARCH_TIMEOUT_MS:-9000}
      MCP_PAGE_TIMEOUT_MS: ${MCP_PAGE_TIMEOUT_MS:-8000}
      MCP_HTTP_HOST: 0.0.0.0
      MCP_HTTP_PORT: ${MCP_HTTP_PORT:-5051}
      MCP_WEB_USER_AGENT: ${MCP_WEB_USER_AGENT:-Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/145.0.0.0 Safari/537.36}
    ports:
      - "${MCP_HTTP_PORT:-5051}:5051"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    stdin_open: true
    tty: true

volumes:
  fubotics_dino_postgres_data:

